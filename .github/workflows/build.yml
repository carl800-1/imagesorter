name: Build Windows exe

on:
  # 推送到主分支：构建 exe + 上传 Artifact + 自动创建 Release
  # 推送 v* 标签：同上，但 Release 用标签名
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

# 创建 Release 并上传附件需要写权限
permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows exe
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install PyQt5 Pillow pyinstaller

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 注意：windows-latest 的默认 shell 是 pwsh，这里不能用 bash 语法
          # （如 $(( $(wc -c < file) / 1024 ))），否则整个步骤会因语法错误直接失败。
          # PIL 是在函数内部条件导入的（from PIL import Image），
          # PyInstaller 静态分析扫不到，必须用 --hidden-import 显式声明。
          pyinstaller --noconfirm --onefile --windowed --clean `
            --name imagesorter `
            --hidden-import PIL `
            photo_organizer_v5.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller 打包失败，退出码 $LASTEXITCODE" }

      - name: Verify build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path dist)) { throw "未生成 dist 目录，构建失败" }
          Write-Host "== dist 目录 =="
          Get-ChildItem dist | ForEach-Object { Write-Host "  $($_.Name)" }
          $exe = Get-ChildItem -Path dist -Filter *.exe -File | Select-Object -First 1
          if (-not $exe) { throw "dist 下未找到 .exe，构建失败" }
          if ($exe.Length -lt 5MB) {
            throw "exe 仅 $([math]::Round($exe.Length / 1MB, 1)) MB，疑似打包不完整"
          }
          Write-Host "主程序: $($exe.Name) ($([math]::Round($exe.Length / 1MB, 1)) MB)"

      - name: Prepare artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 文件名一律用 ASCII：GitHub Actions 在 Windows runner 上传含中文的文件名时中文会被吞掉
          New-Item -ItemType Directory -Force -Path publish | Out-Null
          $exe = Get-ChildItem -Path dist -Filter *.exe -File | Select-Object -First 1
          Copy-Item $exe.FullName "publish\imagesorter.exe" -Force
          Write-Host "== 最终产物 =="
          Get-ChildItem publish | ForEach-Object {
            Write-Host "  $($_.Name)  $([math]::Round($_.Length / 1MB, 1)) MB"
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: imagesorter-win-x64
          path: publish/*
          if-no-files-found: error
          retention-days: 30

      - name: Create Release and upload exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', github.run_number) }}
          name: imagesorter ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', github.run_number) }}
          body: |
            ## picsort 自动构建

            - 构建编号: #${{ github.run_number }}
            - Commit: `${{ github.sha }}`
            - 产物: `imagesorter.exe`（PyInstaller 单文件，免安装，双击运行）

            ### 使用说明
            1. 下载 `imagesorter.exe`
            2. 选择源文件夹（照片/视频所在目录）
            3. 选择目标文件夹
            4. 设置目录层级（年/月/日）后开始整理
          files: publish/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
