name: Build imagesorter

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install PyQt5 Pillow pillow_heif pyinstaller

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "imagesorter" --hidden-import pillow_heif photo_organizer_v5.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: imagesorter
        path: dist/imagesorter.exe

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/imagesorter.exe
        name: Release ${{ github.ref_name }}
        generate_release_notes: true
