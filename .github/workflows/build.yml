name: Build & Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install PyQt5 Pillow pillow_heif pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "imagesorter" --clean photo_organizer_v5.py
          echo "Artifact size: $(( $(wc -c < dist/imagesorter.exe) / 1024 )) KB"

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imagesorter
          path: dist/imagesorter.exe
          retention-days: 7

  release:
    name: Create Release
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: imagesorter
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ format('v{0}', github.run_number) }}
          name: "Release ${{ github.run_number }}"
          body: |
            ## picsort Auto Build
            - Auto-generated by GitHub Actions
            - Build #${{ github.run_number }}
            - Commit: ${{ github.sha }}
          files: |
            dist/imagesorter.exe
          draft: false
          prerelease: false
          generate_release_notes: true
